# Categories of the release notes GitHub generates from merged pull requests.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New features
      labels: [feature]
    - title: Fixes
      labels: [fix]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
