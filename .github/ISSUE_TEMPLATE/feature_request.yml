name: Feature request
description: An idea to make Moviestracker better.
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do that you cannot today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Moviestracker help?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or considered instead?
