name: Dependabot generated files commit

# Commits what dependabot-assets.yml generated to the pull request's branch.
#
# workflow_run, so the commit can come from the pins app (its key is in the
# `pins` environment, which only main can use): a push with GITHUB_TOKEN would
# not start CI. The artifact comes from the pull request's code, so nothing
# here checks out or runs it: the commit goes through the API, and takes only
# the known generated files the branch already tracks.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] checks out and runs nothing from the pull request
    workflows: [Dependabot generated files]
    types: [completed]
    branches: ["dependabot/**"]

permissions: {}

concurrency:
  group: dependabot-assets-commit-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  check:
    name: Look for generated files
    # A fork can name its branch and workflow the same, not its repository.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'dependabot/bun/') ||
       startsWith(github.event.workflow_run.head_branch, 'dependabot/go_modules/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.artifact.outputs.changed }}
    steps:
      - name: Did the build upload any?
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "generated-files")] | length')"
          if [ "$count" -gt 0 ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

  commit:
    name: Commit generated files
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pins
    permissions:
      actions: read
    steps:
      - name: Get a token for the pins app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PINS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PINS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-files
          path: ${{ runner.temp }}/generated-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Commit
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Take only known, tracked generated paths; never execute artifact content.
          generated='^(static/(app\.css|player\.js|theme\.js|torrserver\.js)|internal/views/(icons_gen|[^/]+_templ)\.go)$'
          tree="$RUNNER_TEMP/tree.json"
          additions="$RUNNER_TEMP/additions.jsonl"
          request="$RUNNER_TEMP/request.json"
          gh api "repos/${REPO}/git/trees/${HEAD_SHA}?recursive=1" >"$tree"
          jq -e '.truncated == false' "$tree" >/dev/null
          : >"$additions"
          jq -r --arg generated "$generated" \
            '.tree[] | select(.type == "blob" and .mode == "100644" and (.path | test($generated))) | [.sha, .path] | @tsv' "$tree" |
            while IFS=$'\t' read -r sha f; do
              source_file="$RUNNER_TEMP/generated-files/$f"
              test -f "$source_file"
              test ! -L "$source_file"
              if [ "$(git hash-object --no-filters "$source_file")" != "$sha" ]; then
                base64 -w0 "$source_file" | jq -Rsc --arg path "$f" '{path: $path, contents: .}' >>"$additions"
              fi
            done
          if [ ! -s "$additions" ]; then
            echo "The branch already has these generated files."
            exit 0
          fi
          # expectedHeadOid: if the branch moved meanwhile, its own run rebuilds.
          jq -s --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$HEAD_SHA" '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $head,
              message: {headline: "build: regenerate files for the dependency update"},
              fileChanges: {additions: .}
            }}
          }' "$additions" >"$request"
          gh api graphql --input "$request" --jq .data.createCommitOnBranch.commit.oid
