name: Release

# Push a version tag on a commit of main to release (docs/MAINTAINING.md):
#   git tag -a v1.2.3 -m "Moviestracker v1.2.3" origin/main && git push origin v1.2.3
# The release is created as a draft: check it, then publish it on GitHub.
# Jobs that use the shared TMDB and JacRed keys (secrets MT_SHARED_TMDB_KEY
# and JACRED_APIKEY) run in the `release` environment, whose
# secrets only v* tags can reach. Release builds use no caches, so nothing a
# pull request run left behind can end up in them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases, e.g. v1.2.0-rc.1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: The tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # find main's CI run for the commit
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only reviewed commits are released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: tag a commit that reached main through a pull request."
            exit 1
          fi
      # Build once, release what was tested: when CI already passed for this
      # commit on main, the release does not run it again.
      - name: Did CI pass for this commit on main?
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" --jq '.total_count')"
          if [ "$runs" -gt 0 ]; then
            echo "CI passed for $GITHUB_SHA on main: not running it again."
            echo "tested=true" >>"$GITHUB_OUTPUT"
          else
            echo "No passing CI run for $GITHUB_SHA on main: running CI."
            echo "tested=false" >>"$GITHUB_OUTPUT"
          fi

  ci:
    name: CI
    needs: verify
    if: needs.verify.outputs.tested != 'true'
    uses: ./.github/workflows/ci.yml

  # Each architecture builds on its own CPU (no emulation), pushed by digest;
  # `docker` joins them under the version tag.
  docker-build:
    name: Docker image (${{ matrix.platform }})
    needs: [verify, ci]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before setup-buildx: it pulls moby/buildkit from Docker Hub through
      # the runner's Docker daemon.
      - name: Pull Docker Hub images through Google's mirror
        run: scripts/ci/docker-hub-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builds' Docker Hub pulls through Google's mirror too: the
          # buildx builder does not use the daemon's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/moviestracker
      - name: Build and push by digest, with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          secrets: |
            tmdb_key=${{ secrets.MT_SHARED_TMDB_KEY }}
            jacred_key=${{ secrets.JACRED_APIKEY }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/moviestracker,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Name the digest's artifact
        id: artifact
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "name=digest-${PLATFORM//\//-}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  docker:
    name: Docker image (linux/amd64, linux/arm64)
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the image's build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the version tag here: `latest` and `1.2` move when the draft is
      # published (docker-latest.yml).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository_owner }}/moviestracker
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Join both architectures under the version tag
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/moviestracker
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done < <(jq -r '.annotations[]' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [ "${#sources[@]}" -eq 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          tag="$(jq -r '.tags[0]' <<<"$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$tag"
          echo "digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)" >>"$GITHUB_OUTPUT"
      # `gh attestation verify oci://ghcr.io/lieranderl/moviestracker:<version> -R lieranderl/moviestracker-app`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/moviestracker
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  macos:
    name: Mac app (DMG)
    needs: [verify, ci]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    # Match CI: avoid the ARM64 hosted capacity shortage; build both CPU slices.
    runs-on: macos-26-intel
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Moviestracker.app (Apple Silicon and Intel) and its DMG
        env:
          MT_SHARED_TMDB_KEY: ${{ secrets.MT_SHARED_TMDB_KEY }}
          MT_SHARED_JACRED_KEY: ${{ secrets.JACRED_APIKEY }}
          VERSION: ${{ github.ref_name }}
        run: scripts/macapp.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: [verify, ci]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Inno Setup
        run: scripts/ci/install-inno-setup.ps1
      - name: Build Moviestracker-Setup (x64) with the pinned TorrServer
        shell: bash
        env:
          MT_SHARED_TMDB_KEY: ${{ secrets.MT_SHARED_TMDB_KEY }}
          MT_SHARED_JACRED_KEY: ${{ secrets.JACRED_APIKEY }}
          VERSION: ${{ github.ref_name }}
        run: scripts/winapp.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Draft the GitHub release
    needs: [docker, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the release builds: the CI jobs this run calls upload
          # v0.0.0-ci test builds of their own.
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.dmg *.exe | tee checksums.txt
      # `gh attestation verify <file> -R lieranderl/moviestracker-app`
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moviestracker:${TAG#v}"
          notes="Linux, NAS and home servers: \`docker pull $image\` (linux/amd64, linux/arm64), or \`docker compose up -d\` with [compose.yaml](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/compose.yaml)."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --notes "$notes" --title "Moviestracker $TAG" "${prerelease[@]}" dist/*.dmg dist/*.exe dist/checksums.txt
