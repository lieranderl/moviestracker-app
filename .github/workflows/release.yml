name: Release

# Push a version tag on a commit of main to release (docs/MAINTAINING.md):
#   git tag -a v1.2.3 -m "Moviestracker v1.2.3" origin/main && git push origin v1.2.3
# The release is created as a draft: check it, then publish it on GitHub.
# Jobs that use the shared TMDB and JacRed keys (secrets MT_SHARED_TMDB_KEY
# and JACRED_APIKEY) run in the `release` environment, whose
# secrets only v* tags can reach. Release builds use no caches, so nothing a
# pull request run left behind can end up in them.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*" # pre-releases, e.g. v1.2.0-rc.1

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: The tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only reviewed commits are released
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main: tag a commit that reached main through a pull request."
            exit 1
          fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  docker:
    name: Docker image (linux/amd64, linux/arm64)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # sign the image's build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the setup actions: they pull tonistiigi/binfmt and
      # moby/buildkit from Docker Hub through the runner's Docker daemon.
      - name: Pull Docker Hub images through Google's mirror
        run: scripts/ci/docker-hub-mirror.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builds' Docker Hub pulls through Google's mirror too: the
          # buildx builder does not use the daemon's mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the version tag here: `latest` and `1.2` move when the draft is
      # published (docker-latest.yml).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/moviestracker
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - name: Build and push, with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ github.ref_name }}
          secrets: |
            tmdb_key=${{ secrets.MT_SHARED_TMDB_KEY }}
            jacred_key=${{ secrets.JACRED_APIKEY }}
          provenance: mode=max
          sbom: true
      # `gh attestation verify oci://ghcr.io/lieranderl/moviestracker:<version> -R lieranderl/moviestracker-app`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/moviestracker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  macos:
    name: Mac app (DMG)
    needs: ci
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Moviestracker.app (Apple Silicon and Intel) and its DMG
        env:
          MT_SHARED_TMDB_KEY: ${{ secrets.MT_SHARED_TMDB_KEY }}
          MT_SHARED_JACRED_KEY: ${{ secrets.JACRED_APIKEY }}
          VERSION: ${{ github.ref_name }}
        run: scripts/macapp.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: ci
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Inno Setup
        run: scripts/ci/install-inno-setup.ps1
      - name: Build Moviestracker-Setup (x64) with the pinned TorrServer
        shell: bash
        env:
          MT_SHARED_TMDB_KEY: ${{ secrets.MT_SHARED_TMDB_KEY }}
          MT_SHARED_JACRED_KEY: ${{ secrets.JACRED_APIKEY }}
          VERSION: ${{ github.ref_name }}
        run: scripts/winapp.sh "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Draft the GitHub release
    needs: [docker, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Only the release builds: the CI jobs this run calls upload
          # v0.0.0-ci test builds of their own.
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.dmg *.exe | tee checksums.txt
      # `gh attestation verify <file> -R lieranderl/moviestracker-app`
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.exe
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/moviestracker:${TAG#v}"
          notes="Linux, NAS and home servers: \`docker pull $image\` (linux/amd64, linux/arm64), or \`docker compose up -d\` with [compose.yaml](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/compose.yaml)."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes \
            --notes "$notes" --title "Moviestracker $TAG" "${prerelease[@]}" dist/*.dmg dist/*.exe dist/checksums.txt
