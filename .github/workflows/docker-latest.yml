name: Docker latest

# Publishing a release (not a pre-release) points `latest` and `MAJOR.MINOR`
# at the image the release workflow pushed for its version, so `latest` never
# runs ahead of a draft that is still being checked.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  latest:
    name: Tag the release image latest
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag it
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${OWNER}/moviestracker"
          docker buildx imagetools create -t "$image:latest" -t "$image:${version%.*}" "$image:$version"
