name: Dependabot generated files

# Dependabot updates the Bun asset tools and Go's templ generator without
# rebuilding their committed output. Generate from the pull request merged
# into main, as CI checks it, and upload only the generated files.
# dependabot-assets-commit.yml commits them to the pull request's branch. CI
# still checks that generated files are current.
#
# pull_request, so the pull request's code runs with a read-only token and no
# secrets. Dependabot stops rebasing a branch someone else committed to;
# `@dependabot rebase` starts it over, and this runs again.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions: {}

concurrency:
  group: dependabot-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Rebuild generated files
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'dependabot/bun/') ||
       startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/')
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate templates
        if: startsWith(github.event.pull_request.head.ref, 'dependabot/go_modules/')
        run: go tool templ generate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: startsWith(github.event.pull_request.head.ref, 'dependabot/bun/')
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Build the assets
        if: startsWith(github.event.pull_request.head.ref, 'dependabot/bun/')
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run assets
      - name: Did they change?
        id: diff
        run: |
          if git diff --quiet -- static/app.css static/player.js static/theme.js static/torrserver.js internal/views/icons_gen.go 'internal/views/*_templ.go'; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: generated-files
          path: |
            static/app.css
            static/player.js
            static/theme.js
            static/torrserver.js
            internal/views/icons_gen.go
            internal/views/*_templ.go
          retention-days: 1
          if-no-files-found: error
