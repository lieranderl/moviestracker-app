name: CodeQL

# Code scanning is free for public repositories; while the repository is
# private (without GitHub Advanced Security) the job skips itself.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays, for new queries against unchanged code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
          upload: never
      # templ writes *_templ.go; its generated code trips quality queries (a
      # "useless assignment" per component) that no one can fix by hand.
      # paths-ignore does not apply to Go, a compiled language, so the
      # results for those files are dropped before the upload instead.
      - name: Leave out templ's generated code
        run: |
          for f in sarif-results/*.sarif; do
            jq '(.runs[].results) |= map(select(all(.locations[]?; (.physicalLocation.artifactLocation.uri // "") | endswith("_templ.go") | not)))' "$f" >"$f.tmp"
            mv "$f.tmp" "$f"
          done
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: sarif-results
          category: /language:${{ matrix.language }}
