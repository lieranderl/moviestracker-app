name: Pull request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Squash merges use the PR title as the commit message, and release
      # notes are grouped by it: feat, fix, docs, refactor, perf, test,
      # build, ci, chore, revert; "!" marks a breaking change.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::PR title must look like 'feat(dashboard): show …' or 'fix: …' (Conventional Commits)."
            exit 1
          fi

  dependencies:
    name: Dependency review
    # Needs the dependency graph: public repositories (or GitHub Advanced Security).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-1.0-only, AGPL-3.0-only, AGPL-3.0-or-later
