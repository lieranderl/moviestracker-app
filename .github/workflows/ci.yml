name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, security (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frontend tools
        run: bun install --frozen-lockfile
      - name: Install ShellCheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: Quality gate (generated files, lint, race tests, govulncheck, gosec, build)
        run: make ci
      - name: The client speaks the pinned TorrServer's API
        run: |
          make torrserver
          TORRSERVER_BIN="$PWD/bin/torrserver" go test -count=1 -run TestTheClientSpeaksTheRealTorrServerAPI ./internal/engine/

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # the version the allowlist in .gitleaks.toml is tested with
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  macos:
    name: Tests and Mac app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Includes the packaging tests that build Moviestracker.app with Swift,
      # check both CPU slices and install GStreamer from a fake download.
      - name: Tests on macOS
        run: go test -count=1 ./...
      - name: Build the DMG as a release would (no shared TMDB key)
        run: scripts/macapp.sh v0.0.0-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Moviestracker-dmg-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7
          if-no-files-found: error

  linux-install:
    name: Linux install, upgrade, uninstall (systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build the Linux archive with the pinned TorrServer
        run: MACAPP=no TARGETS=linux/amd64 scripts/release.sh v0.0.0-ci
      - name: Install, set up, upgrade, uninstall and purge it
        run: scripts/ci/linux-install-e2e.sh dist/moviestracker_v0.0.0-ci_linux_amd64.tar.gz

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: make docker-build
      - name: Read-only, no-capability smoke test
        run: make docker-smoke
