name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # The release workflow runs these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, test, security (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install frontend tools
        run: bun install --frozen-lockfile
      - name: Install ShellCheck
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: Quality gate (generated files, lint, race tests, govulncheck, gosec, build)
        run: make ci
      - name: The client speaks the pinned TorrServer's API
        run: |
          make torrserver
          TORRSERVER_BIN="$PWD/bin/torrserver" go test -count=1 -run TestTheClientSpeaksTheRealTorrServerAPI ./internal/engine/

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # the version the allowlist in .gitleaks.toml is tested with
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  macos:
    name: Tests and Mac app (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Includes the packaging tests that build Moviestracker.app with Swift,
      # check both CPU slices and install GStreamer from a fake download.
      - name: Tests on macOS
        run: go test -count=1 ./...
      - name: Build the DMG as a release would (no shared TMDB key)
        run: scripts/macapp.sh v0.0.0-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Moviestracker-dmg-${{ github.sha }}
          path: dist/*.dmg
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows tests, installer, install and uninstall
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Tests on Windows
        run: go test -count=1 ./...
      - name: Install Inno Setup
        run: scripts/ci/install-inno-setup.ps1
      - name: Build the installer as a release would (no shared TMDB key)
        shell: bash
        run: scripts/winapp.sh v0.0.0-ci
      - name: Install, set up, upgrade, quit, uninstall and purge it
        run: scripts/ci/windows-install-e2e.ps1 dist/Moviestracker-Setup-v0.0.0-ci-x64.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Moviestracker-windows-${{ github.sha }}
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Docker image (${{ matrix.arch }})
    # Each architecture on its own CPU, so linux/arm64 (Raspberry Pi, most NAS
    # boxes) runs the same end-to-end test, not just a build under emulation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the image end to end with compose.yaml
        run: scripts/ci/docker-e2e.sh

  web:
    name: Web app image and user store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # web.yml deploys this image from main: it must build, start and answer
      # Cloud Run's probe.
      - name: Build the image and check that it serves
        run: |
          docker build -f Dockerfile.web -t moviestracker-web:ci .
          docker run -d --name web -p 8080:8080 moviestracker-web:ci
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8080/readyz
          docker rm -f web
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The user store's and release feeds' behaviors, against Firestore's
      # emulator as well as in memory (make firestore, make test-store).
      - name: The user store and release feeds work with Firestore
        env:
          FIRESTORE_EMULATOR_IMAGE: gcr.io/google.com/cloudsdktool/google-cloud-cli:587.0.0-emulators@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54
        run: |
          docker run -d --name firestore -p 8086:8086 "$FIRESTORE_EMULATOR_IMAGE" \
            gcloud emulators firestore start --host-port=0.0.0.0:8086
          curl --fail --silent --retry 60 --retry-delay 1 --retry-all-errors http://localhost:8086/
          FIRESTORE_EMULATOR_HOST=localhost:8086 go test -count=1 -race -v ./internal/store/ ./internal/releases/ | tee store.log
          grep -q -- '--- PASS: TestAUsersLanguageIsKept/firestore' store.log
          grep -q -- '--- PASS: TestTheNewestReleasesComeFirstTwentyAPage/firestore' store.log
          docker rm -f firestore

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Template injection, over-broad tokens, cache poisoning in releases,
      # unpinned or impostor actions (.github/zizmor.yml).
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1

  # The one check the main ruleset requires: it passes only when every job
  # above did, so jobs can be added or renamed without touching the ruleset.
  passed:
    name: CI passed
    if: ${{ always() }}
    needs: [quality, secrets, macos, windows, docker, web, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
