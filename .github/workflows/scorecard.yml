name: Scorecard

# OpenSSF Scorecard checks the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases, …) and
# reports them in code scanning; publishing the results gives the public
# badge at https://scorecard.dev/viewer/?uri=github.com/lieranderl/moviestracker-app.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 5 * * 1" # Mondays
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload to code scanning
      id-token: write # publish the results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: scorecard
