name: Set up Go with this job's cache
description: >-
  Go from go.mod, and the module and build caches this job saved from main's
  newest commit. Pull requests and tags only restore: save it at the end of
  the job with actions/cache/save, on pushes to main only, using the outputs.

inputs:
  job:
    description: The cache's name, one per job (each builds different packages).
    required: true
  extra-paths:
    description: More cached folders, one per line (e.g. golangci-lint's cache).
    required: false
    default: ""

outputs:
  key:
    description: The key to save the cache under.
    value: ${{ steps.paths.outputs.key }}
  paths:
    description: The cached folders.
    value: ${{ steps.paths.outputs.paths }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - id: paths
      shell: bash
      env:
        JOB: ${{ inputs.job }}
        EXTRA: ${{ inputs.extra-paths }}
        SUMS: ${{ hashFiles('go.sum') }}
      run: |
        {
          # The newest cache with these go.sum, else the newest of this job.
          echo "restore-keys<<EOF"
          echo "go-$RUNNER_OS-$RUNNER_ARCH-$JOB-$SUMS-"
          echo "go-$RUNNER_OS-$RUNNER_ARCH-$JOB-"
          echo "EOF"
          echo "key=go-$RUNNER_OS-$RUNNER_ARCH-$JOB-$SUMS-$GITHUB_SHA"
          echo "paths<<EOF"
          go env GOCACHE GOMODCACHE
          [ -z "$EXTRA" ] || printf '%s\n' "$EXTRA"
          echo "EOF"
        } >>"$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ steps.paths.outputs.key }}
        restore-keys: ${{ steps.paths.outputs.restore-keys }}
