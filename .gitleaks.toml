# Secret scanning (CI runs gitleaks over the whole history on every push).
# Only made-up test values and documentation examples are allowed here;
# a real key must never be added to this list: remove it and rotate it.
title = "Moviestracker"

[extend]
useDefault = true

# The classic single [allowlist] works with every gitleaks 8 release (the CI
# action pins its own); any one of the conditions below allows a finding.
[allowlist]
description = "Made-up test values, and the what-not-to-do examples of the vendored Go security skill"
regexTarget = "match"
regexes = [
  '''0123456789abcdef0123456789abcdef''',
  '''fedcba9876543210fedcba9876543210''',
  '''dd8255ecdc7ca55fb0bbf81323d87062db1f6d1c\.1\.1790000000\.c2lnbmF0dXJl''',
  # internal/gateway: the characters app passwords are made of, not a key
  '''23456789abcdefghjkmnpqrstuvwxyz''',
]
paths = ['''^\.agents/skills/golang-security/references/secrets\.md$''']
# A test of the web app's certificate upload sent a made-up PEM header, not a
# key; the tests no longer use one, but the PR's history keeps that commit.
commits = ['''7c66069900055443ff39ed1133b65074455748b8''']
